<!doctype html>
<html lang="en" class="h-full bg-background text-foreground scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Havelle</title>
    <meta name="description" content="A local-first, lightweight kanban board. Made in Norway." />
    <link rel="canonical" href="https://havelle.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://havelle.pages.dev/" />
    <meta property="og:title" content="Havelle" />
    <meta property="og:image" content="https://havelle.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Havelle: A local-first, lightweight kanban board." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      property="og:description"
      content="A local-first, lightweight kanban board. Made in Norway."
    />
    <script>
      const theme = localStorage.getItem("theme")
      if (theme) {
        if (
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document.documentElement.classList.add("dark")
      } else {
        document.documentElement.classList.toggle(
          "dark",
          window.matchMedia("(prefers-color-scheme: dark)").matches
        )
      }
    </script>
  </head>

  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
